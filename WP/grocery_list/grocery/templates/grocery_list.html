<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery List</title>
    <style>
        .container{
            margin-left: 40%;
            margin-top: 10%;
            padding: 20px;
            background-color: rgb(240, 223, 185);
            max-width: 200px;
            border-radius: 3%;
            border-color: rgb(255, 221, 134);
            text-align: center;
            align-items: center;
        }
        h3{
            text-align: center;
        }

        button {
            margin-top: 5px;
        }
        table {
            text-align: center;
            margin:auto;
            align-items: center;
            border-collapse: collapse;
            border: 1px solid black;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        th {
            background-color: rgb(218, 214, 214);

            border-collapse: collapse;
            border: 1px solid black;
        }
        th,td{
            padding-left: 5px;
            padding-right: 5px;

            border-collapse: collapse;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <div class="container">

    <h3> Grocery List: </h3>
    <form method="POST">
        {% csrf_token %}

        {{ form.items }}
        <button type ='submit'> Add Items</button>
    </form>

    {% if selected_items %}
    <table>

        <tr>
            <th>Name</th>
            <th>Price</th>
        </tr>

    {% for item in selected_items %}
        <tr>
            <td>{{item.name}}</td>
            <td>{{item.price}}</td>
        </tr>

    {%endfor%}

    </table>

    <p>Total: {{total}}</p>
    {%endif%}

</div>
</body>
</html>
